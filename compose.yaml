# Local development only. The database binds to loopback and has no credentials.
services:
  mongodb:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval
          'try { if (rs.status().ok !== 1) quit(1); } catch (e) {
          rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]}); quit(1); }'
      interval: 5s
      timeout: 10s
      retries: 20
volumes:
  mongodb_data:
